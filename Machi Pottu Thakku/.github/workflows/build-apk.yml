name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Find project folder
        shell: bash
        run: |
          echo "========================================"
          echo "FINDING PROJECT FOLDER"
          echo "========================================"

          PROJECT_DIR=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/index.html" ] && [ -f "$DIR/package.json" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find . \
              -type f \
              -name "package.json" \
              -not -path "./.git/*" \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project folder not found."
            exit 1
          fi

          echo "Project folder found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify source files
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VERIFY SOURCE FILES"
          echo "========================================"

          REQUIRED_FILES=(
            "package.json"
            "index.html"
            "vite.config.js"
            "capacitor.config.json"
            "netlify.toml"
            "js/app.js"
            "js/player.js"
            "js/offline-manager.js"
            "js/ui.js"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing required file: $FILE"
              exit 1
            fi

            echo "PASS: $FILE"
          done

      - name: Install dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "INSTALL DEPENDENCIES"
          echo "========================================"

          npm install

      - name: Verify package configuration
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "PACKAGE CONFIGURATION"
          echo "========================================"

          node -e "
          const p = require('./package.json');

          if (!p.scripts || p.scripts.build !== 'vite build') {
            console.error('ERROR: package.json build script is missing or incorrect.');
            process.exit(1);
          }

          const required = {
            '@capacitor/core': '8.5.0',
            '@capacitor/android': '8.5.0',
            '@capacitor/filesystem': '8.1.3',
            '@mediagrid/capacitor-native-audio': '^3.0.0'
          };

          for (const [name, version] of Object.entries(required)) {
            if (!p.dependencies || p.dependencies[name] !== version) {
              console.error(
                'ERROR: ' + name +
                ' expected ' + version +
                ' but found ' +
                (p.dependencies?.[name] || 'MISSING')
              );
              process.exit(1);
            }
          }

          if (!p.devDependencies || p.devDependencies['@capacitor/cli'] !== '8.5.0') {
            console.error('ERROR: @capacitor/cli 8.5.0 is required.');
            process.exit(1);
          }

          if (!p.devDependencies || !p.devDependencies.vite) {
            console.error('ERROR: Vite is missing.');
            process.exit(1);
          }

          console.log('package.json configuration PASS');
          "

      - name: Build web application with Vite
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VITE BUILD"
          echo "========================================"

          npm run build

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: Vite did not generate dist/index.html"
            exit 1
          fi

          echo "Vite build successful."

      - name: Verify Capacitor configuration
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CAPACITOR CONFIGURATION"
          echo "========================================"

          node -e "
          const fs = require('fs');

          const config = JSON.parse(
            fs.readFileSync('capacitor.config.json', 'utf8')
          );

          if (config.appId !== 'com.machipottuthaaku.app') {
            console.error('ERROR: Incorrect appId.');
            process.exit(1);
          }

          if (config.webDir !== 'dist') {
            console.error('ERROR: webDir must be dist.');
            process.exit(1);
          }

          if (config.server && config.server.url) {
            console.error('ERROR: server.url must NOT be configured.');
            process.exit(1);
          }

          console.log('Capacitor configuration PASS');
          "

      - name: Add Android platform
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "ANDROID PLATFORM"
          echo "========================================"

          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android directory already exists."
          fi

      - name: Sync Capacitor
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CAPACITOR SYNC"
          echo "========================================"

          npx cap sync android

      - name: Verify native audio plugin
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "NATIVE AUDIO PLUGIN"
          echo "========================================"

          npm list @mediagrid/capacitor-native-audio --depth=0

          node -e "
          const p = require('./node_modules/@mediagrid/capacitor-native-audio/package.json');

          console.log('Installed Native Audio version:', p.version);

          if (!p.version.startsWith('3.')) {
            console.error('ERROR: Native Audio 3.x is required.');
            process.exit(1);
          }

          console.log('Native Audio plugin PASS');
          "

      - name: Inject native audio Android configuration
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "ANDROID NATIVE AUDIO CONFIGURATION"
          echo "========================================"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          STRINGS="android/app/src/main/res/values/strings.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text(encoding="utf-8")

          permissions = [
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />',
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />'
          ]

          for permission in permissions:
              permission_name = re.search(
                  r'android:name="([^"]+)"',
                  permission
              ).group(1)

              if permission_name not in manifest:
                  manifest = manifest.replace(
                      '<application',
                      permission + '\n\n    <application',
                      1
                  )

          service = '''        <service
              android:name="us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService"
              android:description="@string/audio_player_service_description"
              android:foregroundServiceType="mediaPlayback"
              android:exported="true">
              <intent-filter>
                  <action android:name="androidx.media3.session.MediaSessionService" />
              </intent-filter>
          </service>'''

          if "us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService" not in manifest:
              manifest = manifest.replace(
                  '</application>',
                  service + '\n    </application>',
                  1
              )

          manifest_path.write_text(manifest, encoding="utf-8")
          print("AndroidManifest.xml updated successfully.")
          PY

          mkdir -p "$(dirname "$STRINGS")"

          if [ ! -f "$STRINGS" ]; then
            cat > "$STRINGS" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Machi Pottu Thaaku</string>
          </resources>
          EOF
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/res/values/strings.xml")
          text = path.read_text(encoding="utf-8")

          entry = '<string name="audio_player_service_description">Machi Pottu Thaaku audio playback service</string>'

          if "audio_player_service_description" not in text:
              text = text.replace(
                  "</resources>",
                  f"    {entry}\n</resources>"
              )

          path.write_text(text, encoding="utf-8")
          print("strings.xml updated successfully.")
          PY

      - name: Verify Android native configuration
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VERIFY ANDROID CONFIGURATION"
          echo "========================================"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q "FOREGROUND_SERVICE" "$MANIFEST" || {
            echo "ERROR: FOREGROUND_SERVICE permission missing."
            exit 1
          }

          grep -q "FOREGROUND_SERVICE_MEDIA_PLAYBACK" "$MANIFEST" || {
            echo "ERROR: MEDIA_PLAYBACK permission missing."
            exit 1
          }

          grep -q "WAKE_LOCK" "$MANIFEST" || {
            echo "ERROR: WAKE_LOCK permission missing."
            exit 1
          }

          grep -q "AudioPlayerService" "$MANIFEST" || {
            echo "ERROR: AudioPlayerService missing."
            exit 1
          }

          grep -q "mediaPlayback" "$MANIFEST" || {
            echo "ERROR: mediaPlayback service type missing."
            exit 1
          }

          echo "Android native configuration PASS."

      - name: Build Android APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"

          echo "========================================"
          echo "BUILD ANDROID APK"
          echo "========================================"

          chmod +x gradlew

          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo "VERIFY APK"
          echo "========================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: machi-pottu-thaaku-debug-apk
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
