name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find project
        run: |
          echo "Searching for package.json..."
          find . -name package.json -not -path './.git/*'

      - name: Install dependencies
        run: |
          PROJECT_DIR=$(dirname "$(find . -name package.json -not -path './.git/*' | head -1)")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          npm install

      - name: Install Capacitor
        run: |
          PROJECT_DIR=$(dirname "$(find . -name package.json -not -path './.git/*' | head -1)")
          cd "$PROJECT_DIR"
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        run: |
          PROJECT_DIR=$(dirname "$(find . -name package.json -not -path './.git/*' | head -1)")
          cd "$PROJECT_DIR"
          npx cap init "Machi Pottu Thaaku" "com.machipottuthaaku.app" --web-dir=.

      - name: Add Android platform
        run: |
          PROJECT_DIR=$(dirname "$(find . -name package.json -not -path './.git/*' | head -1)")
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Sync web project
        run: |
          PROJECT_DIR=$(dirname "$(find . -name package.json -not -path './.git/*' | head -1)")
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name package.json -not -path './.git/*' | head -1)")
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: machi-pottu-thaaku-debug-apk
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
