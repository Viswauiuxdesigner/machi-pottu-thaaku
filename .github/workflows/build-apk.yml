name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # NODE
      # =========================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # =========================================================
      # JAVA
      # =========================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # =========================================================
      # FIND PROJECT
      # =========================================================
      - name: Find project folder
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FINDING PROJECT"
          echo "========================================"

          PROJECT_DIR=""

          while IFS= read -r -d '' PACKAGE_FILE; do
            DIR="$(dirname "$PACKAGE_FILE")"

            if [ -f "$DIR/index.html" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find . \
              -type f \
              -name "package.json" \
              -not -path "./.git/*" \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project folder not found."
            exit 1
          fi

          echo "Project folder:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # INSTALL
      # =========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "NPM INSTALL"
          echo "========================================"

          npm install

          echo ""
          echo "Installed packages:"
          npm list \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/filesystem \
            @mediagrid/capacitor-native-audio \
            vite \
            --depth=0

      # =========================================================
      # WEB BUILD
      # =========================================================
      - name: Build Web App
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VITE BUILD"
          echo "========================================"

          npm run build

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not generated."
            exit 1
          fi

          echo "VITE_BUILD=PASS" >> "$GITHUB_ENV"

      # =========================================================
      # CAPACITOR CONFIG
      # =========================================================
      - name: Verify Capacitor configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CAPACITOR CONFIGURATION"
          echo "========================================"

          if [ ! -f "capacitor.config.json" ]; then
            echo "ERROR: capacitor.config.json is missing."
            exit 1
          fi

          cat capacitor.config.json

          if ! grep -q '"webDir"[[:space:]]*:[[:space:]]*"dist"' capacitor.config.json; then
            echo "ERROR: Capacitor webDir must be dist."
            exit 1
          fi

          echo "Capacitor configuration verified."

      # =========================================================
      # ANDROID PLATFORM
      # =========================================================
      - name: Add Android platform
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "ANDROID PLATFORM"
          echo "========================================"

          if [ ! -d "android" ]; then
            echo "Android platform not found."
            echo "Creating Android platform..."

            npx cap add android
          else
            echo "Android platform already exists."
          fi

      # =========================================================
      # CAPACITOR SYNC
      # =========================================================
      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CAPACITOR SYNC"
          echo "========================================"

          npx cap sync android

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml missing."
            exit 1
          fi

          echo "CAPACITOR_SYNC=PASS" >> "$GITHUB_ENV"

      # =========================================================
      # NATIVE AUDIO VERSION
      # =========================================================
      - name: Verify NativeAudio plugin
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "NATIVE AUDIO VERSION"
          echo "========================================"

          PLUGIN_PACKAGE="node_modules/@mediagrid/capacitor-native-audio/package.json"

          if [ ! -f "$PLUGIN_PACKAGE" ]; then
            echo "ERROR: NativeAudio plugin not found."
            exit 1
          fi

          NATIVE_AUDIO_VERSION=$(node -p "require('./$PLUGIN_PACKAGE').version")

          echo "NativeAudio version: $NATIVE_AUDIO_VERSION"

          echo "NATIVE_AUDIO_VERSION=$NATIVE_AUDIO_VERSION" >> "$GITHUB_ENV"

      # =========================================================
      # NATIVE AUDIO SOURCE PATCH
      # =========================================================
      - name: Patch NativeAudio Next Previous bridge
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "NATIVE AUDIO NEXT/PREVIOUS PATCH"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          base = Path(
              "node_modules/@mediagrid/capacitor-native-audio/"
              "android/src/main/java/us/mediagrid/capacitorjs/plugins/nativeaudio"
          )

          service_path = base / "AudioPlayerService.java"
          source_path = base / "AudioSource.java"
          plugin_path = base / "AudioPlayerPlugin.java"

          required = [service_path, source_path, plugin_path]

          for path in required:
              if not path.exists():
                  print(f"ERROR: Required source not found: {path}")
                  sys.exit(1)

          service = service_path.read_text(encoding="utf-8")
          source = source_path.read_text(encoding="utf-8")
          plugin = plugin_path.read_text(encoding="utf-8")

          print("Actual NativeAudio source files located.")

          # -----------------------------------------------------
          # AudioSource callback fields
          # -----------------------------------------------------
          if "onNextCallbackId" not in source:
              marker = "private String"

              if marker in source:
                  source = source.replace(
                      marker,
                      "private String onNextCallbackId;\n"
                      "    private String onPrevCallbackId;\n\n"
                      + marker,
                      1
                  )
              else:
                  # Fallback: insert after class declaration
                  class_match = re.search(
                      r"(public\s+class\s+AudioSource[^{]*\{)",
                      source
                  )

                  if not class_match:
                      print("ERROR: Could not locate AudioSource class.")
                      sys.exit(1)

                  insert_at = class_match.end()

                  source = (
                      source[:insert_at]
                      + "\n"
                      + "    private String onNextCallbackId;\n"
                      + "    private String onPrevCallbackId;\n"
                      + source[insert_at:]
                  )

          # -----------------------------------------------------
          # AudioSource callback methods
          # -----------------------------------------------------
          if "void setOnNext(" not in source:
              source += r'''

          // Native lock-screen NEXT callback
          public void setOnNext(String callbackId) {
              this.onNextCallbackId = callbackId;
          }

          // Native lock-screen PREVIOUS callback
          public void setOnPrev(String callbackId) {
              this.onPrevCallbackId = callbackId;
          }

          // Fire NEXT callback
          public void fireNext() {
              if (onNextCallbackId == null) {
                  return;
              }

              try {
                  pluginOwner.getBridge()
                      .getSavedCall(onNextCallbackId)
                      .resolve();
              } catch (Exception ignored) {
              }
          }

          // Fire PREVIOUS callback
          public void firePrevious() {
              if (onPrevCallbackId == null) {
                  return;
              }

              try {
                  pluginOwner.getBridge()
                      .getSavedCall(onPrevCallbackId)
                      .resolve();
              } catch (Exception ignored) {
              }
          }
          '''

          source_path.write_text(source, encoding="utf-8")

          # -----------------------------------------------------
          # Plugin methods
          # -----------------------------------------------------
          if "void onNext(" not in plugin:
              plugin += r'''

          @PluginMethod(returnType = PluginMethod.RETURN_CALLBACK)
          public void onNext(PluginCall call) {
              AudioSource source = getAudioSources()
                  .forNotification();

              if (source != null) {
                  source.setOnNext(call.getCallbackId());
              }
          }

          @PluginMethod(returnType = PluginMethod.RETURN_CALLBACK)
          public void onPrevious(PluginCall call) {
              AudioSource source = getAudioSources()
                  .forNotification();

              if (source != null) {
                  source.setOnPrev(call.getCallbackId());
              }
          }
          '''

          plugin_path.write_text(plugin, encoding="utf-8")

          # -----------------------------------------------------
          # MediaSession ForwardingPlayer
          # -----------------------------------------------------
          if "ForwardingPlayer" not in service:
              import_marker = "import"

              first_import = service.find(import_marker)

              if first_import >= 0:
                  service = (
                      service[:first_import]
                      + "import androidx.media3.common.ForwardingPlayer;\n"
                      + service[first_import:]
                  )
              else:
                  print("ERROR: Could not locate imports in AudioPlayerService.")
                  sys.exit(1)

              player_pattern = re.compile(
                  r"MediaSession\.Builder\(\s*this\s*,\s*player\s*\)"
              )

              if not player_pattern.search(service):
                  print(
                      "ERROR: Could not locate MediaSession.Builder "
                      "with the actual player."
                  )
                  sys.exit(1)

              forwarding = r'''
          ForwardingPlayer forwardingPlayer = new ForwardingPlayer(player) {

              @Override
              public boolean hasNextMediaItem() {
                  return true;
              }

              @Override
              public boolean hasPreviousMediaItem() {
                  return true;
              }

              @Override
              public void seekToNext() {
                  AudioSource source =
                      getAudioSourcesFromMediaSession().forNotification();

                  if (source != null) {
                      source.fireNext();
                  }
              }

              @Override
              public void seekToPrevious() {
                  AudioSource source =
                      getAudioSourcesFromMediaSession().forNotification();

                  if (source != null) {
                      source.firePrevious();
                  }
              }
          };

          '''

              service = player_pattern.sub(
                  "MediaSession.Builder(this, forwardingPlayer)",
                  service,
                  count=1
              )

              # Insert wrapper immediately before MediaSession.Builder
              builder_index = service.find(
                  "MediaSession.Builder(this, forwardingPlayer)"
              )

              if builder_index < 0:
                  print("ERROR: MediaSession builder replacement failed.")
                  sys.exit(1)

              service = (
                  service[:builder_index]
                  + forwarding
                  + service[builder_index:]
              )

          service_path.write_text(service, encoding="utf-8")

          print("NativeAudio source patch completed.")
          PY

      # =========================================================
      # VERIFY NATIVE PATCH
      # =========================================================
      - name: Verify NativeAudio patch
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VERIFY NATIVE AUDIO PATCH"
          echo "========================================"

          BASE="node_modules/@mediagrid/capacitor-native-audio/android/src/main/java/us/mediagrid/capacitorjs/plugins/nativeaudio"

          for ITEM in \
            "AudioPlayerService.java" \
            "AudioSource.java" \
            "AudioPlayerPlugin.java"
          do
            if [ ! -f "$BASE/$ITEM" ]; then
              echo "ERROR: $ITEM missing."
              exit 1
            fi
          done

          if ! grep -q "ForwardingPlayer" \
            "$BASE/AudioPlayerService.java"; then
            echo "ERROR: ForwardingPlayer patch missing."
            exit 1
          fi

          if ! grep -q "seekToNext" \
            "$BASE/AudioPlayerService.java"; then
            echo "ERROR: seekToNext patch missing."
            exit 1
          fi

          if ! grep -q "seekToPrevious" \
            "$BASE/AudioPlayerService.java"; then
            echo "ERROR: seekToPrevious patch missing."
            exit 1
          fi

          if ! grep -q "fireNext" \
            "$BASE/AudioSource.java"; then
            echo "ERROR: fireNext missing."
            exit 1
          fi

          if ! grep -q "firePrevious" \
            "$BASE/AudioSource.java"; then
            echo "ERROR: firePrevious missing."
            exit 1
          fi

          if ! grep -q "void onNext" \
            "$BASE/AudioPlayerPlugin.java"; then
            echo "ERROR: onNext plugin bridge missing."
            exit 1
          fi

          if ! grep -q "void onPrevious" \
            "$BASE/AudioPlayerPlugin.java"; then
            echo "ERROR: onPrevious plugin bridge missing."
            exit 1
          fi

          echo "NATIVE_NEXT_PREVIOUS_PATCH=PASS" >> "$GITHUB_ENV"

          echo ""
          echo "Native Next/Previous bridge verified."

      # =========================================================
      # ANDROID MANIFEST
      # =========================================================
      - name: Configure Android media service
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "ANDROID MEDIA SERVICE"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          strings_path = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          manifest = manifest_path.read_text(encoding="utf-8")

          permissions = [
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.WAKE_LOCK",
          ]

          for permission in permissions:
              if permission not in manifest:
                  match = re.search(r"<application\b", manifest)

                  if not match:
                      raise RuntimeError(
                          "Could not find <application>."
                      )

                  insert_at = match.start()

                  permission_xml = (
                      f'<uses-permission android:name="{permission}" />\n    '
                  )

                  manifest = (
                      manifest[:insert_at]
                      + permission_xml
                      + manifest[insert_at:]
                  )

          service_name = (
              "us.mediagrid.capacitorjs.plugins.nativeaudio."
              "AudioPlayerService"
          )

          if service_name not in manifest:
              service_xml = '''        <service
              android:name="us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService"
              android:description="@string/audio_player_service_description"
              android:foregroundServiceType="mediaPlayback"
              android:exported="true">
              <intent-filter>
                  <action android:name="androidx.media3.session.MediaSessionService"/>
              </intent-filter>
          </service>
          '''

              if "</application>" not in manifest:
                  raise RuntimeError(
                      "Could not find </application>."
                  )

              manifest = manifest.replace(
                  "</application>",
                  service_xml + "    </application>",
                  1
              )

          manifest_path.write_text(manifest, encoding="utf-8")

          strings = strings_path.read_text(encoding="utf-8")

          if "audio_player_service_description" not in strings:
              description = (
                  '    <string name="audio_player_service_description">'
                  "Allows audio playback to continue in the background."
                  "</string>\n"
              )

              strings = strings.replace(
                  "</resources>",
                  description + "</resources>",
                  1
              )

              strings_path.write_text(
                  strings,
                  encoding="utf-8"
              )

          print("Android media configuration completed.")
          PY

      # =========================================================
      # VERIFY MANIFEST
      # =========================================================
      - name: Verify Android media configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VERIFY MEDIA CONFIGURATION"
          echo "========================================"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          REQUIRED=(
            "android.permission.FOREGROUND_SERVICE"
            "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"
            "android.permission.WAKE_LOCK"
            "us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService"
          )

          for ITEM in "${REQUIRED[@]}"; do
            if grep -q "$ITEM" "$MANIFEST"; then
              echo "PASS: $ITEM"
            else
              echo "ERROR: Missing $ITEM"
              exit 1
            fi
          done

          echo "MANIFEST_SERVICE=PASS" >> "$GITHUB_ENV"

      # =========================================================
      # APP ICON
      # =========================================================
      - name: Generate Android launcher icons
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "ANDROID APP ICON"
          echo "========================================"

          if [ ! -f "assets/icon.png" ]; then
            echo "ERROR: assets/icon.png is missing."
            exit 1
          fi

          echo "Icon found:"
          file assets/icon.png
          ls -lh assets/icon.png

          npm install --no-save @capacitor/assets

          npx @capacitor/assets generate --android

          ICON_COUNT=$(
            find android/app/src/main/res \
              -type f \
              \( \
                -name "ic_launcher*" \
                -o -name "ic_launcher_foreground*" \
                -o -name "ic_launcher_background*" \
              \) \
              | wc -l
          )

          echo "Generated icon resources: $ICON_COUNT"

          if [ "$ICON_COUNT" -eq 0 ]; then
            echo "ERROR: Launcher icons were not generated."
            exit 1
          fi

          echo "LAUNCHER_ICONS=PASS" >> "$GITHUB_ENV"

      # =========================================================
      # JAVA / GRADLE BUILD
      # =========================================================
      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          echo "========================================"
          echo "ANDROID APK BUILD"
          echo "========================================"

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleDebug --stacktrace

      # =========================================================
      # APK VERIFY
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo "APK VERIFICATION"
          echo "========================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

          echo "APK_BUILD=PASS" >> "$GITHUB_ENV"

      # =========================================================
      # UPLOAD APK
      # =========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: machi-pottu-thaaku-debug-apk
          path: "${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error

      # =========================================================
      # FINAL SUMMARY
      # =========================================================
      - name: Final CI Summary
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "MACHI POTTU THAAKU BUILD SUMMARY"
          echo "========================================"

          echo ""
          echo "NativeAudio: ${NATIVE_AUDIO_VERSION:-Unknown}"
          echo "Vite Build: ${VITE_BUILD:-FAIL}"
          echo "Capacitor Sync: ${CAPACITOR_SYNC:-FAIL}"
          echo "Native Next/Previous Patch: ${NATIVE_NEXT_PREVIOUS_PATCH:-FAIL}"
          echo "Manifest Service: ${MANIFEST_SERVICE:-FAIL}"
          echo "Launcher Icons: ${LAUNCHER_ICONS:-FAIL}"
          echo "APK Build: ${APK_BUILD:-FAIL}"

          {
            echo "## 🎵 Machi Pottu Thaaku — Android Build"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| NativeAudio | ${NATIVE_AUDIO_VERSION:-Unknown} |"
            echo "| Vite Build | ${VITE_BUILD:-FAIL} |"
            echo "| Capacitor Sync | ${CAPACITOR_SYNC:-FAIL} |"
            echo "| Native Next/Previous Patch | ${NATIVE_NEXT_PREVIOUS_PATCH:-FAIL} |"
            echo "| Manifest Service | ${MANIFEST_SERVICE:-FAIL} |"
            echo "| Launcher Icons | ${LAUNCHER_ICONS:-FAIL} |"
            echo "| APK Build | ${APK_BUILD:-FAIL} |"
          } >> "$GITHUB_STEP_SUMMARY"
