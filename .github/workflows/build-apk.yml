name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Find project
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la

          echo "Searching for package.json..."

          PROJECT_DIR=""

          while IFS= read -r -d '' file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/index.html" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find . -type f -name "package.json" -not -path "./.git/*" -print0)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find project directory."
            echo "Available package.json files:"
            find . -type f -name "package.json" -not -path "./.git/*" -print
            exit 1
          fi

          echo "Project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

      - name: Install dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Installing npm dependencies..."
          npm install

          echo "Installing Capacitor..."
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor web directory
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          mkdir -p www

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >
            <title>Machi Pottu Thaaku</title>
          </head>
          <body>
            <p>Loading Machi Pottu Thaaku...</p>
          </body>
          </html>
          EOF

      - name: Create Capacitor config
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.machipottuthaaku.app",
            "appName": "Machi Pottu Thaaku",
            "webDir": "www",
            "server": {
              "url": "https://starlit-sable-83184f.netlify.app",
              "cleartext": false
            }
          }
          EOF

      - name: Add Android platform
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Adding Android platform..."
          npx cap add android

      - name: Sync Capacitor
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Syncing Android project..."
          npx cap sync android

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          echo "Building APK..."
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: machi-pottu-thaaku-debug-apk
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
