name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # IMPORTANT:
    # package.json, assets, js, android project are inside this folder.
    defaults:
      run:
        working-directory: ./Machi Pottu Thaakku

    steps:
      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. NODE
      # ------------------------------------------------------------
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "Machi Pottu Thaakku/package.json"

      # ------------------------------------------------------------
      # 3. JAVA
      # ------------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      # ------------------------------------------------------------
      # 4. VERIFY PROJECT LOCATION
      # ------------------------------------------------------------
      - name: Verify project structure
        run: |
          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          pwd

          echo ""
          echo "Checking package.json..."
          test -f package.json
          echo "PASS: package.json found"

          echo ""
          echo "Checking assets/icon.png..."
          test -f assets/icon.png
          echo "PASS: assets/icon.png found"

          echo ""
          echo "Checking JS files..."
          test -f js/player.js
          test -f js/offline-manager.js
          test -f js/ui.js
          echo "PASS: JS files found"

          echo ""
          echo "Project root:"
          ls -la

      # ------------------------------------------------------------
      # 5. INSTALL DEPENDENCIES
      # ------------------------------------------------------------
      - name: Install dependencies
        run: npm install

      # ------------------------------------------------------------
      # 6. BUILD WEB APP
      # ------------------------------------------------------------
      - name: Build Web App
        run: npm run build

      # ------------------------------------------------------------
      # 7. CAPACITOR ANDROID
      # ------------------------------------------------------------
      - name: Capacitor Add Android
        run: |
          if [ -d "android" ]; then
            echo "Android project already exists."
          else
            echo "Android project not found. Creating it..."
            npx cap add android
          fi

      # ------------------------------------------------------------
      # 8. CAPACITOR SYNC
      # ------------------------------------------------------------
      - name: Capacitor Sync
        run: npx cap sync android

      # ------------------------------------------------------------
      # 9. CONFIGURE AND VERIFY ANDROID MEDIA SERVICE
      # ------------------------------------------------------------
      - name: Configure Android media service
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import sys

          print("========================================")
          print("ANDROID MEDIA CONFIGURATION")
          print("========================================")

          with open("package.json", "r", encoding="utf-8") as f:
              package = json.load(f)

          dependencies = {}
          dependencies.update(package.get("dependencies", {}))
          dependencies.update(package.get("devDependencies", {}))

          plugin_version = dependencies.get(
              "@mediagrid/capacitor-native-audio"
          )

          if not plugin_version:
              print("ERROR: @mediagrid/capacitor-native-audio not found.")
              sys.exit(1)

          print(f"NativeAudio version: {plugin_version}")

          readme_path = (
              "node_modules/@mediagrid/capacitor-native-audio/README.md"
          )

          if not os.path.isfile(readme_path):
              print("ERROR: NativeAudio README not found.")
              sys.exit(1)

          with open(readme_path, "r", encoding="utf-8") as f:
              readme = f.read()

          manifest_path = "android/app/src/main/AndroidManifest.xml"

          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()

          # Required foreground permissions.
          required_permissions = [
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.WAKE_LOCK",
          ]

          for permission in required_permissions:
              if permission not in manifest:
                  manifest = re.sub(
                      r"<application\b",
                      f'<uses-permission android:name="{permission}" />\n    <application',
                      manifest,
                      count=1,
                  )

          # Required AudioPlayerService.
          service_block = """<service
              android:name="us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService"
              android:description="@string/audio_player_service_description"
              android:foregroundServiceType="mediaPlayback"
              android:exported="true">
              <intent-filter>
                  <action android:name="androidx.media3.session.MediaSessionService"/>
              </intent-filter>
          </service>"""

          if "us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService" not in manifest:
              manifest = manifest.replace(
                  "</application>",
                  f"\n        {service_block}\n    </application>",
                  1,
              )

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(manifest)

          # strings.xml
          strings_path = "android/app/src/main/res/values/strings.xml"

          if os.path.isfile(strings_path):
              with open(strings_path, "r", encoding="utf-8") as f:
                  strings = f.read()

              if "audio_player_service_description" not in strings:
                  strings = strings.replace(
                      "</resources>",
                      '    <string name="audio_player_service_description">Allows for audio to play in the background.</string>\n</resources>',
                      1,
                  )

                  with open(strings_path, "w", encoding="utf-8") as f:
                      f.write(strings)

          # Final manifest validation.
          with open(manifest_path, "r", encoding="utf-8") as f:
              final_manifest = f.read()

          checks = [
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.WAKE_LOCK",
              "AudioPlayerService",
          ]

          for check in checks:
              if check not in final_manifest:
                  print(f"ERROR: Missing Android configuration: {check}")
                  sys.exit(1)

          print("")
          print("Manifest Service: PASS")
          print("Foreground Service: PASS")
          print("Media Playback Permission: PASS")
          print("Wake Lock Permission: PASS")

          with open("ci_status.env", "w", encoding="utf-8") as f:
              f.write(f"NATIVE_AUDIO_VERSION={plugin_version}\n")
              f.write("MANIFEST_SERVICE=PASS\n")
          PY

      # ------------------------------------------------------------
      # 10. DIAGNOSE NATIVE NEXT / PREVIOUS
      # ------------------------------------------------------------
      - name: Diagnose lock-screen Next and Previous
        run: |
          python3 <<'PY'
          import os

          base = "node_modules/@mediagrid/capacitor-native-audio/android/src/main/java"

          files = []

          for root, _, names in os.walk(base):
              for name in names:
                  if name.endswith(".java"):
                      files.append(os.path.join(root, name))

          has_next = False
          has_previous = False

          for path in files:
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  source = f.read()

              if (
                  "COMMAND_SEEK_TO_NEXT" in source
                  or "onSeekToNext" in source
                  or "onSkipToNext" in source
                  or "seekToNext" in source
              ):
                  has_next = True

              if (
                  "COMMAND_SEEK_TO_PREVIOUS" in source
                  or "onSeekToPrevious" in source
                  or "onSkipToPrevious" in source
                  or "seekToPrevious" in source
              ):
                  has_previous = True

          print("========================================")
          print("LOCK-SCREEN MEDIA DIAGNOSTIC")
          print("========================================")
          print(f"Native Next support: {'YES' if has_next else 'NO'}")
          print(f"Native Previous support: {'YES' if has_previous else 'NO'}")

          with open("ci_status.env", "a", encoding="utf-8") as f:
              f.write(f"NATIVE_NEXT={'YES' if has_next else 'NO'}\n")
              f.write(f"NATIVE_PREVIOUS={'YES' if has_previous else 'NO'}\n")

          print("")
          print("NOTE:")
          print("The diagnostic does not fail the APK build.")
          PY

      # ------------------------------------------------------------
      # 11. GENERATE APP ICON
      # ------------------------------------------------------------
      - name: Generate Android launcher icons
        run: |
          echo "========================================"
          echo "ANDROID APP ICON"
          echo "========================================"

          if [ ! -f "assets/icon.png" ]; then
            echo "ERROR: assets/icon.png is missing."
            exit 1
          fi

          echo "Found assets/icon.png"

          npm install -g @capacitor/assets

          npx @capacitor/assets generate --android

          echo ""
          echo "Checking generated launcher resources..."

          if [ ! -d "android/app/src/main/res" ]; then
            echo "ERROR: Android resources directory missing."
            exit 1
          fi

          ICON_COUNT=$(find android/app/src/main/res -type f \
            \( -name "ic_launcher*" -o -name "ic_launcher_foreground*" -o -name "ic_launcher_background*" \) \
            | wc -l)

          echo "Generated launcher resource count: $ICON_COUNT"

          if [ "$ICON_COUNT" -eq 0 ]; then
            echo "ERROR: No launcher icon resources generated."
            exit 1
          fi

          echo "Launcher Icons: PASS"

          echo "LAUNCHER_ICONS=PASS" >> ci_status.env

      # ------------------------------------------------------------
      # 12. VERIFY JS FILES
      # ------------------------------------------------------------
      - name: Verify application files
        run: |
          echo "========================================"
          echo "APPLICATION FILE VERIFICATION"
          echo "========================================"

          test -f js/player.js
          test -f js/offline-manager.js
          test -f js/ui.js
          test -f js/app.js

          echo "player.js: PASS"
          echo "offline-manager.js: PASS"
          echo "ui.js: PASS"
          echo "app.js: PASS"

      # ------------------------------------------------------------
      # 13. BUILD APK
      # ------------------------------------------------------------
      - name: Build APK
        working-directory: ./Machi Pottu Thaaku/android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      # ------------------------------------------------------------
      # 14. VERIFY APK
      # ------------------------------------------------------------
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo "APK_BUILD=FAIL" >> ci_status.env
            exit 1
          fi

          SIZE=$(du -h "$APK" | cut -f1)

          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"
          echo "APK: $APK"
          echo "Size: $SIZE"

          echo "APK_BUILD=PASS" >> ci_status.env

      # ------------------------------------------------------------
      # 15. UPLOAD APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: machi-pottu-thaaku-debug
          path: "Machi Pottu Thaaku/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error

      # ------------------------------------------------------------
      # 16. FINAL CI SUMMARY
      # ------------------------------------------------------------
      - name: Final CI Summary
        if: always()
        run: |
          echo "========================================"
          echo "MACHI POTTU THAAKU - ANDROID BUILD"
          echo "========================================"

          if [ -f "ci_status.env" ]; then
            cat ci_status.env
            source ci_status.env
          fi

          echo ""
          echo "### 🎵 Machi Pottu Thaaku — Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| NativeAudio | ${NATIVE_AUDIO_VERSION:-Unknown} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Vite Build | PASS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Capacitor Sync | PASS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Manifest Service | ${MANIFEST_SERVICE:-FAIL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Launcher Icons | ${LAUNCHER_ICONS:-FAIL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lock-screen Next | ${NATIVE_NEXT:-Unknown} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lock-screen Previous | ${NATIVE_PREVIOUS:-Unknown} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK Build | ${APK_BUILD:-FAIL} |" >> "$GITHUB_STEP_SUMMARY"
