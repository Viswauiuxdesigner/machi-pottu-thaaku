name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Machi Pottu Thaakku

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        run: npx cap init "Machi Pottu Thaaku" "com.machipottuthaaku.app" --web-dir=.

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: ./Machi Pottu Thaakku/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: machi-pottu-thaaku-debug-apk
          path: ./Machi Pottu Thaakku/android/app/build/outputs/apk/debug/app-debug.apk
