name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check project
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la
          echo "Project contents:"
          ls -la "./Machi Pottu Thaakku"
          echo "Package file:"
          ls -la "./Machi Pottu Thaakku/package.json"

      - name: Install dependencies
        shell: bash
        run: |
          cd "./Machi Pottu Thaakku"
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor web directory
        shell: bash
        run: |
          cd "./Machi Pottu Thaakku"

          mkdir -p www

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >
            <title>Machi Pottu Thaaku</title>
          </head>
          <body>
            <p>Loading Machi Pottu Thaaku...</p>
          </body>
          </html>
          EOF

      - name: Create Capacitor config
        shell: bash
        run: |
          cd "./Machi Pottu Thaakku"

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.machipottuthaaku.app",
            "appName": "Machi Pottu Thaaku",
            "webDir": "www",
            "server": {
              "url": "https://starlit-sable-83184f.netlify.app",
              "cleartext": false
            }
          }
          EOF

      - name: Add Android platform
        shell: bash
        run: |
          cd "./Machi Pottu Thaakku"
          npx cap add android

      - name: Sync Capacitor
        shell: bash
        run: |
          cd "./Machi Pottu Thaakku"
          npx cap sync android

      - name: Build Debug APK
        shell: bash
        run: |
          cd "./Machi Pottu Thaakku/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: machi-pottu-thaaku-debug-apk
          path: "./Machi Pottu Thaakku/android/app/build/outputs/apk/debug/app-debug.apk"
