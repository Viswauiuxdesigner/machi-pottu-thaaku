name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Find project folder
        shell: bash
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -200

          PROJECT_DIR=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/index.html" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find . \
              -type f \
              -name "package.json" \
              -not -path "./.git/*" \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project folder not found."
            exit 1
          fi

          echo "Project folder found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          npm install

          npm install \
            @capacitor/core@8.5.0 \
            @capacitor/cli@8.5.0 \
            @capacitor/android@8.5.0 \
            @capacitor/filesystem@8.1.3 \
            capacitor-music-controls-plugin@8.0.0

      - name: Create Capacitor web directory
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          rm -rf www
          mkdir -p www

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >
            <title>Machi Pottu Thaaku</title>
          </head>
          <body>
            <p>Loading Machi Pottu Thaaku...</p>
          </body>
          </html>
          EOF

      - name: Create Capacitor config
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.machipottuthaaku.app",
            "appName": "Machi Pottu Thaaku",
            "webDir": "www",
            "server": {
              "url": "https://starlit-sable-83184f.netlify.app",
              "cleartext": false
            }
          }
          EOF

      - name: Add Android platform
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          npx cap add android

      - name: Sync Capacitor
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          npx cap sync android

      - name: Verify Capacitor setup
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "NODE VERSION"
          echo "========================================"
          node -v

          echo "========================================"
          echo "NPM VERSION"
          echo "========================================"
          npm -v

          echo "========================================"
          echo "CAPACITOR PACKAGES"
          echo "========================================"

          npm list \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/filesystem \
            capacitor-music-controls-plugin \
            --depth=0

      - name: Build Android APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "========================================"
          echo "APK SUCCESSFULLY GENERATED"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: machi-pottu-thaaku-debug-apk
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
