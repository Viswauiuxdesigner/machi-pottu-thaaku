name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Machi Pottu Thakku

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Add Android platform
        run: |
          if [ -d "android" ]; then
            echo "Android project already exists."
          else
            npx cap add android
          fi

      - name: Apply Custom NativeAudio Java
        run: |
          SOURCE="package/android/src/main/java/us/mediagrid/capacitorjs/plugins/nativeaudio"
          TARGET="node_modules/@mediagrid/capacitor-native-audio/android/src/main/java/us/mediagrid/capacitorjs/plugins/nativeaudio"

          echo "Checking custom NativeAudio source..."

          test -f "$SOURCE/AudioPlayerPlugin.java"
          test -f "$SOURCE/AudioPlayerService.java"
          test -f "$SOURCE/AudioSource.java"

          mkdir -p "$TARGET"

          cp "$SOURCE/AudioPlayerPlugin.java" "$TARGET/AudioPlayerPlugin.java"
          cp "$SOURCE/AudioPlayerService.java" "$TARGET/AudioPlayerService.java"
          cp "$SOURCE/AudioSource.java" "$TARGET/AudioSource.java"

          echo "Custom NativeAudio Java files copied."

      - name: Verify Custom NativeAudio Java
        run: |
          TARGET="node_modules/@mediagrid/capacitor-native-audio/android/src/main/java/us/mediagrid/capacitorjs/plugins/nativeaudio"

          grep -q "emitNextEvent" "$TARGET/AudioPlayerPlugin.java"
          grep -q "emitPreviousEvent" "$TARGET/AudioPlayerPlugin.java"

          grep -q "emitNext" "$TARGET/AudioSource.java"
          grep -q "emitPrevious" "$TARGET/AudioSource.java"

          grep -q "ForwardingPlayer" "$TARGET/AudioPlayerService.java"
          grep -q "COMMAND_SEEK_TO_NEXT" "$TARGET/AudioPlayerService.java"
          grep -q "COMMAND_SEEK_TO_PREVIOUS" "$TARGET/AudioPlayerService.java"
          grep -q "seekToNext" "$TARGET/AudioPlayerService.java"
          grep -q "seekToPrevious" "$TARGET/AudioPlayerService.java"

          echo "NativeAudio custom Java verification: PASS"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android Media Playback
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text(encoding="utf-8")

          permissions = [
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.WAKE_LOCK",
          ]

          for permission in permissions:
              permission_line = f'    <uses-permission android:name="{permission}" />'
              if permission not in manifest:
                  manifest = manifest.replace(
                      "<application",
                      permission_line + "\n    <application",
                      1
                  )

          service_block = """        <service
              android:name="us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService"
              android:description="@string/audio_player_service_description"
              android:foregroundServiceType="mediaPlayback"
              android:exported="true">
              <intent-filter>
                  <action android:name="androidx.media3.session.MediaSessionService"/>
              </intent-filter>
          </service>"""

          if "us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService" not in manifest:
              manifest = manifest.replace(
                  "</application>",
                  service_block + "\n    </application>",
                  1
              )

          manifest_path.write_text(manifest, encoding="utf-8")

          strings_path = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          strings_path.parent.mkdir(parents=True, exist_ok=True)

          if strings_path.exists():
              strings = strings_path.read_text(encoding="utf-8")
          else:
              strings = "<resources>\n</resources>\n"

          service_description = (
              '<string name="audio_player_service_description">'
              'Allows for audio to play in the background.'
              '</string>'
          )

          if "audio_player_service_description" not in strings:
              strings = strings.replace(
                  "</resources>",
                  f"    {service_description}\n</resources>"
              )

          strings_path.write_text(strings, encoding="utf-8")

          print("Android Media3 service configured.")
          print("Foreground service permissions configured.")
          print("Audio service description configured.")
          PY

      - name: Verify Android Media Playback Configuration
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q "android.permission.FOREGROUND_SERVICE" "$MANIFEST"
          grep -q "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" "$MANIFEST"
          grep -q "android.permission.WAKE_LOCK" "$MANIFEST"
          grep -q "us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService" "$MANIFEST"
          grep -q "androidx.media3.session.MediaSessionService" "$MANIFEST"

          grep -q "audio_player_service_description" \
            android/app/src/main/res/values/strings.xml

          echo "Android Media3 configuration: PASS"
          echo "Lock-screen service: PASS"
          echo "Foreground permissions: PASS"

      - name: Generate Android App Icons
        run: |
          if [ ! -f "assets/icon.png" ]; then
            echo "ERROR: assets/icon.png not found."
            exit 1
          fi

          npm install -g @capacitor/assets

          npx @capacitor/assets generate --android

          echo "Android app icons generated."

          if [ ! -d "android/app/src/main/res/mipmap-mdpi" ]; then
            echo "ERROR: Android launcher icons were not generated."
            exit 1
          fi

          echo "Android launcher icons: PASS"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK Build: FAIL"
            exit 1
          fi

          echo "APK Build: PASS"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: machi-pottu-thaaku-debug-apk
          path: Machi Pottu Thakku/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
