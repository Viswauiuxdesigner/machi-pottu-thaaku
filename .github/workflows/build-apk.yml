name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Find project folder
        shell: bash
        run: |
          PROJECT_DIR=$(find . -name package.json -not -path './.git/*' -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Install dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor web directory
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          mkdir -p www

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >
            <title>Machi Pottu Thaaku</title>
          </head>
          <body>
            <p>Loading Machi Pottu Thaaku...</p>
          </body>
          </html>
          EOF

      - name: Create Capacitor config
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.machipottuthaaku.app",
            "appName": "Machi Pottu Thaaku",
            "webDir": "www",
            "server": {
              "url": "https://starlit-sable-83184f.netlify.app",
              "cleartext": false
            }
          }
          EOF

      - name: Add Android platform
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Sync Capacitor
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: machi-pottu-thaaku-debug-apk
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
