name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Find project folder
        shell: bash
        run: |
          echo "========================================"
          echo "REPOSITORY CONTENTS"
          echo "========================================"

          find . -maxdepth 3 -type f | sort | head -300

          PROJECT_DIR=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/index.html" ] && [ -f "$DIR/package.json" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find . \
              -type f \
              -name "package.json" \
              -not -path "./.git/*" \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project folder not found."
            exit 1
          fi

          echo "========================================"
          echo "PROJECT FOLDER"
          echo "========================================"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "INSTALLING PROJECT DEPENDENCIES"
          echo "========================================"

          npm install

          echo "========================================"
          echo "VERIFYING NATIVE AUDIO PACKAGE"
          echo "========================================"

          npm install @mediagrid/capacitor-native-audio@3.0.0 --no-save

          npm list \
            @capacitor/core \
            @capacitor/android \
            @capacitor/filesystem \
            @mediagrid/capacitor-native-audio \
            vite \
            --depth=0

      - name: Build web application with Vite
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VITE BUILD"
          echo "========================================"

          npm run build

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: Vite build did not generate dist/index.html"
            exit 1
          fi

          echo "Vite build completed successfully."

          echo "========================================"
          echo "DIST CONTENTS"
          echo "========================================"

          find dist -maxdepth 3 -type f | sort | head -300

      - name: Verify Capacitor configuration
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CAPACITOR CONFIGURATION"
          echo "========================================"

          if [ ! -f "capacitor.config.json" ]; then
            echo "ERROR: capacitor.config.json is missing."
            exit 1
          fi

          cat capacitor.config.json

          echo "========================================"
          echo "VERIFYING DIST DIRECTORY"
          echo "========================================"

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory does not exist."
            exit 1
          fi

      - name: Add Android platform
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CAPACITOR ANDROID PLATFORM"
          echo "========================================"

          if [ ! -d "android" ]; then
            echo "Android project does not exist."
            echo "Creating Android project..."

            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Sync Capacitor
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CAPACITOR SYNC"
          echo "========================================"

          npx cap sync android

      - name: Verify native audio plugin
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "NATIVE AUDIO PLUGIN"
          echo "========================================"

          PLUGIN_DIR="node_modules/@mediagrid/capacitor-native-audio"

          if [ ! -d "$PLUGIN_DIR" ]; then
            echo "ERROR: Native Audio plugin was not installed."
            exit 1
          fi

          echo "Plugin directory:"
          echo "$PLUGIN_DIR"

          echo ""
          echo "Plugin package.json:"
          cat "$PLUGIN_DIR/package.json"

          echo ""
          echo "Checking Android native service..."

          SERVICE_FILE="$PLUGIN_DIR/android/src/main/java/us/mediagrid/capacitorjs/plugins/nativeaudio/AudioPlayerService.kt"

          if [ -f "$SERVICE_FILE" ]; then
            echo "AudioPlayerService.kt found:"
            echo "$SERVICE_FILE"
          else
            echo "AudioPlayerService.kt not found at expected path."
            echo "Searching plugin..."
            find "$PLUGIN_DIR/android" \
              -type f \
              \( -name "*AudioPlayerService*" -o -name "*Service*" \) \
              -print || true
          fi

          echo ""
          echo "Plugin README Android configuration:"
          grep -n -A20 -B5 "AndroidManifest.xml" \
            "$PLUGIN_DIR/README.md" || true

      - name: Inject native audio Android configuration
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "INJECTING NATIVE AUDIO CONFIGURATION"
          echo "========================================"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          STRINGS="android/app/src/main/res/values/strings.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if [ ! -f "$STRINGS" ]; then
            echo "ERROR: strings.xml not found."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          strings_path = Path("android/app/src/main/res/values/strings.xml")

          manifest = manifest_path.read_text(encoding="utf-8")
          strings = strings_path.read_text(encoding="utf-8")

          permissions = [
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />'
          ]

          service = '''        <service
              android:name="us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService"
              android:description="@string/audio_player_service_description"
              android:foregroundServiceType="mediaPlayback"
              android:exported="true">
              <intent-filter>
                  <action android:name="androidx.media3.session.MediaSessionService"/>
              </intent-filter>
          </service>'''

          for permission in permissions:
              if permission not in manifest:
                  marker = '<application'
                  index = manifest.find(marker)

                  if index == -1:
                      raise RuntimeError(
                          "Could not find <application> in AndroidManifest.xml"
                      )

                  manifest = (
                      manifest[:index]
                      + permission
                      + "\n\n    "
                      + manifest[index:]
                  )

          service_name = (
              'android:name="us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService"'
          )

          if service_name not in manifest:
              marker = '</application>'

              if marker not in manifest:
                  raise RuntimeError(
                      "Could not find </application> in AndroidManifest.xml"
                  )

              manifest = manifest.replace(
                  marker,
                  service + "\n    " + marker,
                  1
              )

          manifest_path.write_text(manifest, encoding="utf-8")

          string_name = (
              'name="audio_player_service_description"'
          )

          if string_name not in strings:
              marker = '</resources>'

              if marker not in strings:
                  raise RuntimeError(
                      "Could not find </resources> in strings.xml"
                  )

              service_string = (
                  '    <string name="audio_player_service_description">'
                  'Allows for audio to play in the background.'
                  '</string>\n'
              )

              strings = strings.replace(
                  marker,
                  service_string + marker,
                  1
              )

              strings_path.write_text(strings, encoding="utf-8")

          print("Native audio Android configuration injected successfully.")
          PY

      - name: Verify Android native configuration
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          STRINGS="android/app/src/main/res/values/strings.xml"

          echo "========================================"
          echo "ANDROID MANIFEST"
          echo "========================================"

          cat "$MANIFEST"

          echo ""
          echo "========================================"
          echo "AUDIO SERVICE CHECK"
          echo "========================================"

          if grep -q \
            "us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService" \
            "$MANIFEST"; then
            echo "PASS: AudioPlayerService is registered."
          else
            echo "ERROR: AudioPlayerService is NOT registered."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "PERMISSION CHECK"
          echo "========================================"

          grep -q \
            "android.permission.FOREGROUND_SERVICE" \
            "$MANIFEST" \
            && echo "PASS: FOREGROUND_SERVICE"

          grep -q \
            "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" \
            "$MANIFEST" \
            && echo "PASS: FOREGROUND_SERVICE_MEDIA_PLAYBACK"

          grep -q \
            "android.permission.WAKE_LOCK" \
            "$MANIFEST" \
            && echo "PASS: WAKE_LOCK"

          echo ""
          echo "========================================"
          echo "SERVICE DESCRIPTION"
          echo "========================================"

          grep -n \
            "audio_player_service_description" \
            "$STRINGS"

      - name: Build Android APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"

          echo "========================================"
          echo "ANDROID GRADLE BUILD"
          echo "========================================"

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo "APK VERIFICATION"
          echo "========================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

          echo ""
          echo "APK PATH:"
          echo "$APK"

      - name: Create CI Native Build Report
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          cat > CI_NATIVE_BUILD_REPORT.md <<'EOF'
          # CI Native Build Report

          ## Build Environment

          - Node.js: GitHub Actions runner
          - Java: 21
          - Android: Generated by Capacitor CI
          - Build system: Vite + Capacitor + Gradle

          ## Web Build

          - Vite production build completed.
          - `dist/index.html` verified.

          ## Capacitor

          - Capacitor Android project generated/synchronized in CI.
          - `webDir` uses the repository Capacitor configuration.

          ## Native Audio

          - Package: `@mediagrid/capacitor-native-audio`
          - Version: `3.0.0`
          - Android AudioPlayerService configured.
          - Foreground media playback permissions configured.
          - Wake lock permission configured.

          ## APK

          - Debug APK generated successfully.
          - Output:
            `android/app/build/outputs/apk/debug/app-debug.apk`

          ## Important

          Successful compilation does NOT mean real-device offline playback or lock-screen controls are verified.

          Those require installation and manual testing on a physical Android device.
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: machi-pottu-thaaku-debug-apk
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error

      - name: Upload CI report
        uses: actions/upload-artifact@v4
        with:
          name: machi-pottu-thaaku-ci-report
          path: "**/CI_NATIVE_BUILD_REPORT.md"
          if-no-files-found: error
