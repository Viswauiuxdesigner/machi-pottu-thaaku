name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check project files
        run: |
          echo "Repository:"
          ls -la
          echo "Project folder:"
          ls -la "Machi Pottu Thaakku"
          echo "Package:"
          ls -la "Machi Pottu Thaakku/package.json"

      - name: Install dependencies
        run: |
          cd "Machi Pottu Thaakku"
          npm install

      - name: Install Capacitor
        run: |
          cd "Machi Pottu Thaakku"
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        run: |
          cd "Machi Pottu Thaakku"
          npx cap init "Machi Pottu Thaaku" "com.machipottuthaaku.app" --web-dir=.

      - name: Add Android platform
        run: |
          cd "Machi Pottu Thaakku"
          npx cap add android

      - name: Sync web project
        run: |
          cd "Machi Pottu Thaakku"
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          cd "Machi Pottu Thaakku/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: machi-pottu-thaaku-debug-apk
          path: "Machi Pottu Thaakku/android/app/build/outputs/apk/debug/app-debug.apk"
