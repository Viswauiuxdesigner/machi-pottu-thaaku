name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # ---------------------------------------------------------
      # FIND PROJECT
      # ---------------------------------------------------------
      - name: Find project folder
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FINDING PROJECT"
          echo "========================================"

          PROJECT_DIR=""

          while IFS= read -r -d '' PACKAGE_FILE; do
            DIR="$(dirname "$PACKAGE_FILE")"

            if [ -f "$DIR/index.html" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find . \
              -type f \
              -name "package.json" \
              -not -path "./.git/*" \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find project folder."
            exit 1
          fi

          echo "Project folder: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # INSTALL
      # ---------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "INSTALL DEPENDENCIES"
          echo "========================================"

          npm install

          echo ""
          echo "Installed important packages:"
          npm list \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/filesystem \
            @mediagrid/capacitor-native-audio \
            vite \
            --depth=0

      # ---------------------------------------------------------
      # VITE BUILD
      # ---------------------------------------------------------
      - name: Build Web App
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VITE BUILD"
          echo "========================================"

          npm run build

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not generated."
            exit 1
          fi

          echo "PASS: Vite build completed."
          echo "VITE_BUILD=PASS" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # CAPACITOR CONFIG
      # ---------------------------------------------------------
      - name: Verify Capacitor configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CAPACITOR CONFIG"
          echo "========================================"

          if [ ! -f "capacitor.config.json" ]; then
            echo "ERROR: capacitor.config.json is missing."
            exit 1
          fi

          cat capacitor.config.json

          if ! grep -q '"webDir"[[:space:]]*:[[:space:]]*"dist"' capacitor.config.json; then
            echo "ERROR: Capacitor webDir must be dist."
            exit 1
          fi

          echo "PASS: Capacitor configuration verified."

      # ---------------------------------------------------------
      # ANDROID PLATFORM
      # ---------------------------------------------------------
      - name: Add Android platform
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "ANDROID PLATFORM"
          echo "========================================"

          if [ ! -d "android" ]; then
            echo "Android directory not found."
            echo "Creating Android platform..."

            npx cap add android
          else
            echo "Android directory already exists."
          fi

      # ---------------------------------------------------------
      # CAPACITOR SYNC
      # ---------------------------------------------------------
      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CAPACITOR SYNC"
          echo "========================================"

          npx cap sync android

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml was not generated."
            exit 1
          fi

          echo "PASS: Capacitor Android sync completed."

      # ---------------------------------------------------------
      # NATIVE AUDIO VERSION
      # ---------------------------------------------------------
      - name: Verify NativeAudio plugin
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "NATIVE AUDIO"
          echo "========================================"

          PLUGIN_PACKAGE="node_modules/@mediagrid/capacitor-native-audio/package.json"

          if [ ! -f "$PLUGIN_PACKAGE" ]; then
            echo "ERROR: NativeAudio plugin not found."
            exit 1
          fi

          NATIVE_AUDIO_VERSION=$(node -p "require('./$PLUGIN_PACKAGE').version")

          echo "NativeAudio version: $NATIVE_AUDIO_VERSION"

          echo "NATIVE_AUDIO_VERSION=$NATIVE_AUDIO_VERSION" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # MANIFEST CONFIGURATION
      # ---------------------------------------------------------
      - name: Configure Android media service
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "ANDROID MEDIA SERVICE CONFIGURATION"
          echo "========================================"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          STRINGS="android/app/src/main/res/values/strings.xml"

          python3 <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          strings_path = Path("android/app/src/main/res/values/strings.xml")

          manifest = manifest_path.read_text(encoding="utf-8")

          permissions = [
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
              'android.permission.WAKE_LOCK'
          ]

          for permission in permissions:
              if permission not in manifest:
                  application_match = re.search(r'<application\b', manifest)

                  if not application_match:
                      raise RuntimeError(
                          "Could not find <application> in AndroidManifest.xml"
                      )

                  insert_at = application_match.start()

                  permission_xml = (
                      f'<uses-permission android:name="{permission}" />\n    '
                  )

                  manifest = (
                      manifest[:insert_at]
                      + permission_xml
                      + manifest[insert_at:]
                  )

          service_name = (
              'us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService'
          )

          if service_name not in manifest:
              application_close = '</application>'

              service_xml = '''        <service
              android:name="us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService"
              android:description="@string/audio_player_service_description"
              android:foregroundServiceType="mediaPlayback"
              android:exported="true">
              <intent-filter>
                  <action android:name="androidx.media3.session.MediaSessionService"/>
              </intent-filter>
          </service>
          '''

              if application_close not in manifest:
                  raise RuntimeError(
                      "Could not find </application> in AndroidManifest.xml"
                  )

              manifest = manifest.replace(
                  application_close,
                  service_xml + "    </application>",
                  1
              )

          manifest_path.write_text(manifest, encoding="utf-8")

          strings = strings_path.read_text(encoding="utf-8")

          if "audio_player_service_description" not in strings:
              service_description = (
                  '    <string name="audio_player_service_description">'
                  'Allows audio playback to continue in the background.'
                  '</string>\n'
              )

              if "</resources>" not in strings:
                  raise RuntimeError(
                      "Could not find </resources> in strings.xml"
                  )

              strings = strings.replace(
                  "</resources>",
                  service_description + "</resources>",
                  1
              )

              strings_path.write_text(strings, encoding="utf-8")

          print("Android media service configuration completed.")
          PY

      # ---------------------------------------------------------
      # VERIFY MANIFEST
      # ---------------------------------------------------------
      - name: Verify Android media configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VERIFY ANDROID MEDIA CONFIGURATION"
          echo "========================================"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          REQUIRED=(
            "android.permission.FOREGROUND_SERVICE"
            "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"
            "android.permission.WAKE_LOCK"
            "us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService"
          )

          for ITEM in "${REQUIRED[@]}"; do
            if grep -q "$ITEM" "$MANIFEST"; then
              echo "PASS: $ITEM"
            else
              echo "ERROR: Missing $ITEM"
              echo "MANIFEST_SERVICE=FAIL" >> "$GITHUB_ENV"
              exit 1
            fi
          done

          echo "MANIFEST_SERVICE=PASS" >> "$GITHUB_ENV"

          echo ""
          echo "Final AndroidManifest media configuration:"
          grep -E \
            "FOREGROUND_SERVICE|WAKE_LOCK|AudioPlayerService|foregroundServiceType" \
            "$MANIFEST" || true

      # ---------------------------------------------------------
      # NEXT / PREVIOUS DIAGNOSTIC
      # ---------------------------------------------------------
      - name: Diagnose lock-screen Next and Previous
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "LOCK-SCREEN NEXT / PREVIOUS DIAGNOSTIC"
          echo "========================================"

          PLUGIN_ANDROID="node_modules/@mediagrid/capacitor-native-audio/android"

          NEXT_FOUND="NO"
          PREVIOUS_FOUND="NO"

          if grep -R -n -E \
            "COMMAND_SEEK_TO_NEXT|onSeekToNext|onSkipToNext|SEEK_TO_NEXT" \
            "$PLUGIN_ANDROID" \
            2>/dev/null; then
            NEXT_FOUND="YES"
          fi

          if grep -R -n -E \
            "COMMAND_SEEK_TO_PREVIOUS|onSeekToPrevious|onSkipToPrevious|SEEK_TO_PREVIOUS" \
            "$PLUGIN_ANDROID" \
            2>/dev/null; then
            PREVIOUS_FOUND="YES"
          fi

          echo ""
          echo "Next support: $NEXT_FOUND"
          echo "Previous support: $PREVIOUS_FOUND"

          echo "NEXT_SUPPORT=$NEXT_FOUND" >> "$GITHUB_ENV"
          echo "PREVIOUS_SUPPORT=$PREVIOUS_FOUND" >> "$GITHUB_ENV"

          if [ "$NEXT_FOUND" = "NO" ]; then
            echo "WARNING: Native Next command was not detected."
            echo "Build will continue."
          fi

          if [ "$PREVIOUS_FOUND" = "NO" ]; then
            echo "WARNING: Native Previous command was not detected."
            echo "Build will continue."
          fi

      # ---------------------------------------------------------
      # APP ICON
      # ---------------------------------------------------------
      - name: Generate Android launcher icons
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "ANDROID APP ICON"
          echo "========================================"

          if [ ! -f "assets/icon.png" ]; then
            echo "ERROR: assets/icon.png is missing."
            echo "Please add the supplied logo as assets/icon.png."
            echo "LAUNCHER_ICONS=FAIL" >> "$GITHUB_ENV"
            exit 1
          fi

          echo "Icon source:"
          file assets/icon.png
          ls -lh assets/icon.png

          echo ""
          echo "Installing Capacitor Assets..."

          npm install --no-save @capacitor/assets

          echo ""
          echo "Generating Android launcher icons..."

          npx @capacitor/assets generate --android

          echo ""
          echo "Verifying generated icon resources..."

          ICON_COUNT=$(
            find android/app/src/main/res \
              -type f \
              \( \
                -name "ic_launcher*" \
                -o -name "ic_launcher_foreground*" \
                -o -name "ic_launcher_background*" \
              \) \
              | wc -l
          )

          echo "Generated launcher resource count: $ICON_COUNT"

          if [ "$ICON_COUNT" -eq 0 ]; then
            echo "ERROR: No Android launcher icons were generated."
            echo "LAUNCHER_ICONS=FAIL" >> "$GITHUB_ENV"
            exit 1
          fi

          echo "PASS: Android launcher icons generated."
          echo "LAUNCHER_ICONS=PASS" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # APK BUILD
      # ---------------------------------------------------------
      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          echo "========================================"
          echo "ANDROID APK BUILD"
          echo "========================================"

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleDebug --stacktrace

      # ---------------------------------------------------------
      # APK VERIFY
      # ---------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo "APK VERIFICATION"
          echo "========================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo "APK_BUILD=FAIL" >> "$GITHUB_ENV"
            exit 1
          fi

          echo "PASS: APK generated successfully."
          ls -lh "$APK"

          echo "APK_BUILD=PASS" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # UPLOAD APK
      # ---------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: machi-pottu-thaaku-debug-apk
          path: "${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error

      # ---------------------------------------------------------
      # FINAL CI SUMMARY
      # ---------------------------------------------------------
      - name: Final CI Summary
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "MACHI POTTU THAAKU - CI SUMMARY"
          echo "========================================"

          echo ""
          echo "NativeAudio Version: ${NATIVE_AUDIO_VERSION:-Unknown}"
          echo "Vite Build: ${VITE_BUILD:-FAIL}"
          echo "Manifest Service: ${MANIFEST_SERVICE:-FAIL}"
          echo "Launcher Icons: ${LAUNCHER_ICONS:-FAIL}"
          echo "Next Support: ${NEXT_SUPPORT:-UNKNOWN}"
          echo "Previous Support: ${PREVIOUS_SUPPORT:-UNKNOWN}"
          echo "APK Build: ${APK_BUILD:-FAIL}"

          {
            echo "## 🎵 Machi Pottu Thaaku — Android Build"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| NativeAudio Version | ${NATIVE_AUDIO_VERSION:-Unknown} |"
            echo "| Vite Build | ${VITE_BUILD:-FAIL} |"
            echo "| Manifest Service | ${MANIFEST_SERVICE:-FAIL} |"
            echo "| Launcher Icons | ${LAUNCHER_ICONS:-FAIL} |"
            echo "| Lock-screen Next | ${NEXT_SUPPORT:-UNKNOWN} |"
            echo "| Lock-screen Previous | ${PREVIOUS_SUPPORT:-UNKNOWN} |"
            echo "| APK Build | ${APK_BUILD:-FAIL} |"
          } >> "$GITHUB_STEP_SUMMARY"
