name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Capacitor Add Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Capacitor Sync
        run: npx cap sync android

      # ============================================================
      # VERIFY PLUGIN + MANIFEST + PATCH NATIVE NEXT/PREVIOUS
      # ============================================================
      - name: Configure Android Media Service and Native Lock Controls
        shell: python
        run: |
          import json
          import os
          import re
          import sys

          PLUGIN_ROOT = "node_modules/@mediagrid/capacitor-native-audio"
          JAVA_ROOT = os.path.join(
              PLUGIN_ROOT,
              "android/src/main/java/us/mediagrid/capacitorjs/plugins/nativeaudio"
          )

          PLAYER_SERVICE = os.path.join(
              JAVA_ROOT,
              "AudioPlayerService.java"
          )

          AUDIO_SOURCE = os.path.join(
              JAVA_ROOT,
              "AudioSource.java"
          )

          AUDIO_PLUGIN = os.path.join(
              JAVA_ROOT,
              "AudioPlayerPlugin.java"
          )

          def fail(message):
              print("")
              print("============================================================")
              print("ERROR")
              print("============================================================")
              print(message)
              print("============================================================")
              sys.exit(1)

          def read_file(path):
              if not os.path.exists(path):
                  fail(f"Required file does not exist: {path}")

              with open(path, "r", encoding="utf-8") as f:
                  return f.read()

          def write_file(path, content):
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          def class_body_range(source, class_name):
              """
              Locate the actual class declaration and return the opening
              and closing brace positions for that class.
              This avoids blindly appending Java methods outside the class.
              """

              pattern = re.compile(
                  r"\bclass\s+" + re.escape(class_name) + r"\b[^{]*\{"
              )

              match = pattern.search(source)

              if not match:
                  fail(
                      f"Could not locate Java class '{class_name}' "
                      "in the installed plugin source."
                  )

              opening = source.find("{", match.start())

              depth = 0
              in_string = False
              in_char = False
              in_line_comment = False
              in_block_comment = False
              escape = False

              i = opening

              while i < len(source):
                  c = source[i]
                  n = source[i + 1] if i + 1 < len(source) else ""

                  if in_line_comment:
                      if c == "\n":
                          in_line_comment = False
                      i += 1
                      continue

                  if in_block_comment:
                      if c == "*" and n == "/":
                          in_block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_string:
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue

                  if in_char:
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      in_line_comment = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      in_block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          return opening, i

                  i += 1

              fail(
                  f"Could not find balanced closing brace for class '{class_name}'."
              )

          def ensure_inside_class(source, class_name, signature):
              start, end = class_body_range(source, class_name)
              body = source[start:end + 1]

              if signature not in body:
                  return False

              return True

          def class_has_method(source, class_name, method_name):
              start, end = class_body_range(source, class_name)
              body = source[start:end + 1]

              return re.search(
                  r"\b" + re.escape(method_name) +
                  r"\s*\(",
                  body
              ) is not None

          # ------------------------------------------------------------
          # 1. Verify package + plugin version
          # ------------------------------------------------------------

          package = json.loads(
              read_file("package.json")
          )

          dependencies = package.get("dependencies", {})
          plugin_version = dependencies.get(
              "@mediagrid/capacitor-native-audio"
          )

          if not plugin_version:
              fail(
                  "@mediagrid/capacitor-native-audio is missing from package.json."
              )

          print(f"NativeAudio package: {plugin_version}")

          if not os.path.isdir(PLUGIN_ROOT):
              fail(
                  "Installed @mediagrid/capacitor-native-audio package "
                  "could not be found."
              )

          # ------------------------------------------------------------
          # 2. Read actual Java source BEFORE modifying anything
          # ------------------------------------------------------------

          service_src = read_file(PLAYER_SERVICE)
          source_src = read_file(AUDIO_SOURCE)
          plugin_src = read_file(AUDIO_PLUGIN)

          print("")
          print("============================================================")
          print("INSPECTING ACTUAL NATIVE AUDIO SOURCE")
          print("============================================================")

          print(f"AudioPlayerService.java: {len(service_src)} bytes")
          print(f"AudioSource.java: {len(source_src)} bytes")
          print(f"AudioPlayerPlugin.java: {len(plugin_src)} bytes")

          # ------------------------------------------------------------
          # 3. Basic source safety checks
          # ------------------------------------------------------------

          for path, src in [
              (PLAYER_SERVICE, service_src),
              (AUDIO_SOURCE, source_src),
              (AUDIO_PLUGIN, plugin_src),
          ]:
              stripped = src.lstrip()

              if not stripped.startswith("package "):
                  fail(
                      f"Java source structure invalid before patch: {path}"
                  )

          # ------------------------------------------------------------
          # 4. Inspect existing MediaSession construction
          # ------------------------------------------------------------

          media_session_pattern = re.compile(
              r"new\s+MediaSession\.Builder\s*\(\s*this\s*,\s*player\s*\)"
          )

          media_session_match = media_session_pattern.search(service_src)

          if not media_session_match:
              print("")
              print("WARNING: Could not find exact MediaSession.Builder(this, player)")
              print("The installed plugin source may use a different construction pattern.")
              print("")
              print("Relevant MediaSession lines:")

              for line in service_src.splitlines():
                  if "MediaSession" in line or "mediaSession" in line:
                      print(line)

              fail(
                  "Stopping instead of guessing how MediaSession is constructed."
              )

          print("Verified MediaSession.Builder(this, player) exists.")

          # ------------------------------------------------------------
          # 5. Patch AudioSource INSIDE AudioSource class
          # ------------------------------------------------------------

          source_start, source_end = class_body_range(
              source_src,
              "AudioSource"
          )

          source_body = source_src[source_start:source_end]

          source_additions = []

          if "onNextCallbackId" not in source_body:
              source_additions.append(
                  """
              private String onNextCallbackId;
              private String onPrevCallbackId;
              """
              )

          if "setOnNext(" not in source_body:
              source_additions.append(
                  """
              public void setOnNext(String callbackId) {
                  this.onNextCallbackId = callbackId;
              }
              """
              )

          if "setOnPrev(" not in source_body:
              source_additions.append(
                  """
              public void setOnPrev(String callbackId) {
                  this.onPrevCallbackId = callbackId;
              }
              """
              )

          if "fireNext(" not in source_body:
              source_additions.append(
                  """
              public void fireNext() {
                  if (onNextCallbackId != null) {
                      pluginOwner.getBridge().getSavedCall(onNextCallbackId).resolve();
                  }
              }
              """
              )

          if "firePrevious(" not in source_body:
              source_additions.append(
                  """
              public void firePrevious() {
                  if (onPrevCallbackId != null) {
                      pluginOwner.getBridge().getSavedCall(onPrevCallbackId).resolve();
                  }
              }
              """
              )

          if source_additions:
              insertion = "\n".join(source_additions) + "\n"
              source_src = (
                  source_src[:source_end]
                  + insertion
                  + source_src[source_end:]
              )

          # ------------------------------------------------------------
          # 6. Patch AudioPlayerPlugin INSIDE AudioPlayerPlugin class
          # ------------------------------------------------------------

          plugin_start, plugin_end = class_body_range(
              plugin_src,
              "AudioPlayerPlugin"
          )

          plugin_body = plugin_src[plugin_start:plugin_end]

          plugin_additions = []

          if "void onNext(" not in plugin_body:
              plugin_additions.append(
                  """
              @PluginMethod(returnType = PluginMethod.RETURN_CALLBACK)
              public void onNext(PluginCall call) {
                  String audioId = call.getString("audioId");
                  AudioSource audioSource = audioSources.get(audioId);

                  if (audioSource != null) {
                      audioSource.setOnNext(call.getCallbackId());
                  }
              }
              """
              )

          if "void onPrevious(" not in plugin_body:
              plugin_additions.append(
                  """
              @PluginMethod(returnType = PluginMethod.RETURN_CALLBACK)
              public void onPrevious(PluginCall call) {
                  String audioId = call.getString("audioId");
                  AudioSource audioSource = audioSources.get(audioId);

                  if (audioSource != null) {
                      audioSource.setOnPrev(call.getCallbackId());
                  }
              }
              """
              )

          if plugin_additions:
              insertion = "\n".join(plugin_additions) + "\n"
              plugin_src = (
                  plugin_src[:plugin_end]
                  + insertion
                  + plugin_src[plugin_end:]
              )

          # ------------------------------------------------------------
          # 7. Patch AudioPlayerService INSIDE service class
          # ------------------------------------------------------------

          service_start, service_end = class_body_range(
              service_src,
              "AudioPlayerService"
          )

          service_body = service_src[service_start:service_end]

          # Import ForwardingPlayer if missing.
          if "import androidx.media3.common.ForwardingPlayer;" not in service_src:
              import_match = list(
                  re.finditer(
                      r"^import\s+[^;]+;\s*$",
                      service_src,
                      re.MULTILINE
                  )
              )

              if not import_match:
                  fail(
                      "Could not locate import section in AudioPlayerService.java."
                  )

              insert_at = import_match[-1].end()
              service_src = (
                  service_src[:insert_at]
                  + "\nimport androidx.media3.common.ForwardingPlayer;"
                  + service_src[insert_at:]
              )

          # Recalculate class scope after import modification.
          service_start, service_end = class_body_range(
              service_src,
              "AudioPlayerService"
          )

          service_body = service_src[service_start:service_end]

          # We only modify the exact MediaSession constructor expression.
          wrapper_block = """
          ForwardingPlayer forwardingPlayer = new ForwardingPlayer(player) {
              @Override
              public boolean hasNextMediaItem() {
                  return true;
              }

              @Override
              public boolean hasPreviousMediaItem() {
                  return true;
              }

              @Override
              public void seekToNext() {
                  AudioSource notificationSource =
                      getAudioSourcesFromMediaSession().forNotification();

                  if (notificationSource != null) {
                      notificationSource.fireNext();
                  }
              }

              @Override
              public void seekToPrevious() {
                  AudioSource notificationSource =
                      getAudioSourcesFromMediaSession().forNotification();

                  if (notificationSource != null) {
                      notificationSource.firePrevious();
                  }
              }
          };
          """

          # Only inject once.
          if "ForwardingPlayer forwardingPlayer" not in service_body:
              service_src = media_session_pattern.sub(
                  "new MediaSession.Builder(this, forwardingPlayer)",
                  service_src,
                  count=1
              )

              # Recalculate exact class scope.
              service_start, service_end = class_body_range(
                  service_src,
                  "AudioPlayerService"
              )

              service_body = service_src[service_start:service_end]

              # Locate the player declaration and insert wrapper directly
              # before MediaSession construction.
              media_builder_match = re.search(
                  r"new\s+MediaSession\.Builder\s*\(\s*this\s*,\s*forwardingPlayer\s*\)",
                  service_body
              )

              if not media_builder_match:
                  fail(
                      "MediaSession constructor replacement failed. "
                      "Stopping before Gradle."
                  )

              # Insert wrapper immediately before MediaSession construction.
              absolute_builder_start = (
                  service_start + media_builder_match.start()
              )

              service_src = (
                  service_src[:absolute_builder_start]
                  + wrapper_block
                  + "\n"
                  + service_src[absolute_builder_start:]
              )

          # ------------------------------------------------------------
          # 8. Write patched source
          # ------------------------------------------------------------

          write_file(PLAYER_SERVICE, service_src)
          write_file(AUDIO_SOURCE, source_src)
          write_file(AUDIO_PLUGIN, plugin_src)

          # ------------------------------------------------------------
          # 9. Re-open ACTUAL disk files and validate
          # ------------------------------------------------------------

          service_check = read_file(PLAYER_SERVICE)
          source_check = read_file(AUDIO_SOURCE)
          plugin_check = read_file(AUDIO_PLUGIN)

          required_checks = {
              "AudioPlayerPlugin: onNext": class_has_method(
                  plugin_check,
                  "AudioPlayerPlugin",
                  "onNext"
              ),
              "AudioPlayerPlugin: onPrevious": class_has_method(
                  plugin_check,
                  "AudioPlayerPlugin",
                  "onPrevious"
              ),
              "AudioSource: setOnNext": class_has_method(
                  source_check,
                  "AudioSource",
                  "setOnNext"
              ),
              "AudioSource: setOnPrev": class_has_method(
                  source_check,
                  "AudioSource",
                  "setOnPrev"
              ),
              "AudioSource: fireNext": class_has_method(
                  source_check,
                  "AudioSource",
                  "fireNext"
              ),
              "AudioSource: firePrevious": class_has_method(
                  source_check,
                  "AudioSource",
                  "firePrevious"
              ),
              "AudioPlayerService: seekToNext": class_has_method(
                  service_check,
                  "AudioPlayerService",
                  "seekToNext"
              ),
              "AudioPlayerService: seekToPrevious": class_has_method(
                  service_check,
                  "AudioPlayerService",
                  "seekToPrevious"
              ),
          }

          print("")
          print("============================================================")
          print("NATIVE LOCK-SCREEN VALIDATION")
          print("============================================================")

          for name, result in required_checks.items():
              print(f"{name} = {'YES' if result else 'NO'}")

          if not all(required_checks.values()):
              fail(
                  "One or more required native Next/Previous methods "
                  "were not injected inside their intended Java classes."
              )

          # ------------------------------------------------------------
          # 10. Verify callback fields / ForwardingPlayer
          # ------------------------------------------------------------

          required_strings = [
              ("AudioSource.onNextCallbackId", "onNextCallbackId", source_check),
              ("AudioSource.onPrevCallbackId", "onPrevCallbackId", source_check),
              ("AudioSource.fireNext", "fireNext()", source_check),
              ("AudioSource.firePrevious", "firePrevious()", source_check),
              ("AudioPlayerService.ForwardingPlayer", "ForwardingPlayer forwardingPlayer", service_check),
              ("AudioPlayerService.MediaSession", "MediaSession.Builder(this, forwardingPlayer)", service_check),
          ]

          for label, needle, content in required_strings:
              if needle not in content:
                  fail(
                      f"Required native source element missing: {label}"
                  )

          # ------------------------------------------------------------
          # 11. Basic Java structural validation
          # ------------------------------------------------------------

          def brace_balance(source):
              depth = 0
              for char in source:
                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1

                  if depth < 0:
                      return depth

              return depth

          for label, content in [
              ("AudioPlayerService.java", service_check),
              ("AudioSource.java", source_check),
              ("AudioPlayerPlugin.java", plugin_check),
          ]:
              if brace_balance(content) != 0:
                  fail(
                      f"{label} has unbalanced braces after patch."
                  )

              if not content.lstrip().startswith("package "):
                  fail(
                      f"{label} package declaration is no longer valid."
                  )

          print("")
          print("Native Java structural validation: PASS")
          print("Native Next/Previous bridge validation: PASS")

          # ------------------------------------------------------------
          # 12. Manifest configuration
          # ------------------------------------------------------------

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          manifest = read_file(manifest_path)

          permissions = [
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.WAKE_LOCK",
          ]

          for permission in permissions:
              if permission not in manifest:
                  manifest = re.sub(
                      r"<application\b",
                      f'<uses-permission android:name="{permission}" />\n    <application',
                      manifest,
                      count=1
                  )

          if "AudioPlayerService" not in manifest:
              service_xml = """
              <service
                  android:name="us.mediagrid.capacitorjs.plugins.nativeaudio.AudioPlayerService"
                  android:description="@string/audio_player_service_description"
                  android:foregroundServiceType="mediaPlayback"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="androidx.media3.session.MediaSessionService"/>
                  </intent-filter>
              </service>
              """

              manifest = manifest.replace(
                  "</application>",
                  service_xml + "\n</application>",
                  1
              )

          write_file(manifest_path, manifest)

          # ------------------------------------------------------------
          # 13. Verify manifest after injection
          # ------------------------------------------------------------

          manifest_check = read_file(manifest_path)

          for permission in permissions:
              if permission not in manifest_check:
                  fail(
                      f"Manifest permission missing after injection: {permission}"
                  )

          if "AudioPlayerService" not in manifest_check:
              fail(
                  "AudioPlayerService missing from AndroidManifest.xml."
              )

          print("Android Manifest validation: PASS")

          # ------------------------------------------------------------
          # 14. strings.xml
          # ------------------------------------------------------------

          strings_path = "android/app/src/main/res/values/strings.xml"

          if os.path.exists(strings_path):
              strings = read_file(strings_path)

              if "audio_player_service_description" not in strings:
                  strings = strings.replace(
                      "</resources>",
                      '    <string name="audio_player_service_description">Allows for audio to play in the background.</string>\n</resources>',
                      1
                  )

                  write_file(strings_path, strings)

          print("Media service configuration: PASS")

          # ------------------------------------------------------------
          # CI status file
          # ------------------------------------------------------------

          with open("ci_status.env", "w", encoding="utf-8") as f:
              f.write(f"NATIVE_AUDIO_VERSION={plugin_version}\n")
              f.write("NATIVE_NEXT=YES\n")
              f.write("NATIVE_PREVIOUS=YES\n")
              f.write("MANIFEST_SERVICE=PASS\n")

      # ============================================================
      # GENERATE APP ICON
      # ============================================================
      - name: Generate Android launcher icons
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID APP ICON"
          echo "========================================"

          if [ ! -f "assets/icon.png" ]; then
            echo "ERROR: assets/icon.png is missing."
            echo "Please upload the logo as assets/icon.png"
            echo 'LAUNCHER_ICONS=FAIL' >> ci_status.env
            exit 1
          fi

          file assets/icon.png

          npm install -g @capacitor/assets

          npx @capacitor/assets generate --android

          echo "Verifying generated Android launcher icons..."

          if [ ! -d "android/app/src/main/res" ]; then
            echo "ERROR: Android res directory missing."
            echo 'LAUNCHER_ICONS=FAIL' >> ci_status.env
            exit 1
          fi

          ICON_COUNT=$(find android/app/src/main/res -type f \
            \( -name "ic_launcher*" -o -name "ic_launcher_foreground*" -o -name "ic_launcher_background*" \) \
            | wc -l)

          echo "Generated launcher icon files: $ICON_COUNT"

          if [ "$ICON_COUNT" -lt 1 ]; then
            echo "ERROR: No launcher icon resources were generated."
            echo 'LAUNCHER_ICONS=FAIL' >> ci_status.env
            exit 1
          fi

          echo 'LAUNCHER_ICONS=PASS' >> ci_status.env

          echo "Android launcher icon generation: PASS"

      # ============================================================
      # BUILD APK
      # ============================================================
      - name: Build Android APK
        working-directory: ./android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            echo 'APK_BUILD=FAIL' >> ci_status.env
            exit 1
          fi

          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)

          echo "APK generated successfully."
          echo "APK size: $APK_SIZE"

          echo 'APK_BUILD=PASS' >> ci_status.env

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: machi-pottu-thaaku-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ============================================================
      # FINAL SUMMARY
      # ============================================================
      - name: Final CI Summary
        if: always()
        shell: bash
        run: |
          echo "## 🎵 Machi Pottu Thaaku — Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "ci_status.env" ]; then
            source ci_status.env
          fi

          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| NativeAudio Version | ${NATIVE_AUDIO_VERSION:-Unknown} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Native Next Bridge | ${NATIVE_NEXT:-FAIL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Native Previous Bridge | ${NATIVE_PREVIOUS:-FAIL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Manifest Service | ${MANIFEST_SERVICE:-FAIL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Launcher Icons | ${LAUNCHER_ICONS:-FAIL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK Build | ${APK_BUILD:-FAIL} |" >> "$GITHUB_STEP_SUMMARY"
