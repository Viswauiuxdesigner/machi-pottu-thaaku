name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Find project folder
        shell: bash
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -200

          PROJECT_DIR=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/index.html" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find . \
              -type f \
              -name "package.json" \
              -not -path "./.git/*" \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project folder not found."
            exit 1
          fi

          echo "Project folder found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Installing existing project dependencies..."
          npm install

          echo "Installing Capacitor..."
          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

      - name: Diagnostic - Exact Capacitor Version
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "======================================"
          echo "NODE VERSION"
          echo "======================================"
          node -v

          echo "======================================"
          echo "NPM VERSION"
          echo "======================================"
          npm -v

          echo "======================================"
          echo "CAP COMMAND LOCATION"
          echo "======================================"
          which cap || true

          echo "======================================"
          echo "NPX CAP VERSION"
          echo "======================================"
          npx cap --version

          echo "======================================"
          echo "CAPACITOR PACKAGE FILES"
          echo "======================================"
          find node_modules/@capacitor \
            -maxdepth 2 \
            -name package.json \
            -print 2>/dev/null || true

          echo "======================================"
          echo "CAPACITOR CORE VERSION"
          echo "======================================"
          if [ -f "node_modules/@capacitor/core/package.json" ]; then
            node -p "require('./node_modules/@capacitor/core/package.json').version"
          else
            echo "Capacitor Core package not found"
          fi

          echo "======================================"
          echo "CAPACITOR ANDROID VERSION"
          echo "======================================"
          if [ -f "node_modules/@capacitor/android/package.json" ]; then
            node -p "require('./node_modules/@capacitor/android/package.json').version"
          else
            echo "Capacitor Android package not found"
          fi

          echo "======================================"
          echo "CAPACITOR CLI VERSION"
          echo "======================================"
          if [ -f "node_modules/@capacitor/cli/package.json" ]; then
            node -p "require('./node_modules/@capacitor/cli/package.json').version"
          else
            echo "Capacitor CLI package not found"
          fi

      - name: Create Capacitor web directory
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          rm -rf www
          mkdir -p www

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >
            <title>Machi Pottu Thaaku</title>
          </head>
          <body>
            <p>Loading Machi Pottu Thaaku...</p>
          </body>
          </html>
          EOF

      - name: Create Capacitor config
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.machipottuthaaku.app",
            "appName": "Machi Pottu Thaaku",
            "webDir": "www",
            "server": {
              "url": "https://starlit-sable-83184f.netlify.app",
              "cleartext": false
            }
          }
          EOF

      - name: Add Android platform
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          npx cap add android

      - name: Sync Capacitor
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          npx cap sync android

      - name: Fix Kotlin dependency conflict
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"

          echo "Applying Kotlin dependency resolution..."

          cat >> build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion("1.8.22")
                      }
                  }
              }
          }
          EOF

          echo "Kotlin dependency fix applied."

      - name: Build Android APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: machi-pottu-thaaku-debug-apk
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
