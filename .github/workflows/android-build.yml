name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build Web App
      run: npm run build
      
    - name: Apply Custom NativeAudio Java
      run: |
        CUSTOM_SRC="package/android/src/main/java/us/mediagrid/capacitorjs/plugins/nativeaudio"
        NODE_SRC="node_modules/@mediagrid/capacitor-native-audio/android/src/main/java/us/mediagrid/capacitorjs/plugins/nativeaudio"
        
        if [ ! -f "$CUSTOM_SRC/AudioPlayerPlugin.java" ] || [ ! -f "$CUSTOM_SRC/AudioSource.java" ] || [ ! -f "$CUSTOM_SRC/AudioPlayerService.java" ]; then
          echo "ERROR: Custom Java files not found in $CUSTOM_SRC"
          exit 1
        fi
        
        if [ ! -d "$NODE_SRC" ]; then
          echo "ERROR: Target directory $NODE_SRC does not exist in node_modules!"
          exit 1
        fi
        
        cp "$CUSTOM_SRC/AudioPlayerPlugin.java" "$NODE_SRC/"
        cp "$CUSTOM_SRC/AudioSource.java" "$NODE_SRC/"
        cp "$CUSTOM_SRC/AudioPlayerService.java" "$NODE_SRC/"
        
        grep -q "emitNextEvent" "$NODE_SRC/AudioPlayerPlugin.java" || { echo "Missing emitNextEvent"; exit 1; }
        grep -q "emitPreviousEvent" "$NODE_SRC/AudioPlayerPlugin.java" || { echo "Missing emitPreviousEvent"; exit 1; }
        grep -q "emitNext" "$NODE_SRC/AudioSource.java" || { echo "Missing emitNext"; exit 1; }
        grep -q "emitPrevious" "$NODE_SRC/AudioSource.java" || { echo "Missing emitPrevious"; exit 1; }
        grep -q "COMMAND_SEEK_TO_NEXT" "$NODE_SRC/AudioPlayerService.java" || { echo "Missing COMMAND_SEEK_TO_NEXT"; exit 1; }
        grep -q "COMMAND_SEEK_TO_PREVIOUS" "$NODE_SRC/AudioPlayerService.java" || { echo "Missing COMMAND_SEEK_TO_PREVIOUS"; exit 1; }
        grep -q "ForwardingPlayer" "$NODE_SRC/AudioPlayerService.java" || { echo "Missing ForwardingPlayer"; exit 1; }
        grep -q "seekToNext" "$NODE_SRC/AudioPlayerService.java" || { echo "Missing seekToNext()"; exit 1; }
        grep -q "seekToPrevious" "$NODE_SRC/AudioPlayerService.java" || { echo "Missing seekToPrevious()"; exit 1; }
        
        grep -q "nativeMediaNext" "js/player.js" || { echo "Missing nativeMediaNext in JS"; exit 1; }
        grep -q "nativeMediaPrevious" "js/player.js" || { echo "Missing nativeMediaPrevious in JS"; exit 1; }
        grep -q "handleTrackEnded" "js/player.js" || { echo "Missing handleTrackEnded in JS"; exit 1; }
        grep -q "playNext" "js/player.js" || { echo "Missing playNext in JS"; exit 1; }
        grep -q "playPrev" "js/player.js" || { echo "Missing playPrev in JS"; exit 1; }
        
        echo "Custom NativeAudio Java successfully applied and validated."
        
    - name: Capacitor Add Android
      run: npx cap add android || echo "Android already added"
      
    - name: Capacitor Sync
      run: npx cap sync android
      
    - name: Verify Plugin and Native Configuration
      run: |
        python3 -c "
        import os, re, sys, json
        
        # 1. Verify plugin version
        try:
            with open('package.json', 'r') as f:
                pkg = json.load(f)
            deps = pkg.get('dependencies', {})
            version = deps.get('@mediagrid/capacitor-native-audio', '')
            if not version:
                raise Exception('Plugin not found in package.json dependencies')
            print(f'Found plugin version: {version}')
        except Exception as e:
            print(f'Verification failed: {e}')
            sys.exit(1)
            
        # 2. Extract configuration from plugin README
        readme_path = 'node_modules/@mediagrid/capacitor-native-audio/README.md'
        with open(readme_path, 'r', encoding='utf-8') as f:
            readme = f.read()
            
        service_match = re.search(r'<service[\s\S]*?</service>', readme)
        permissions_match = re.findall(r'<uses-permission.*?>', readme)
        
        if not service_match:
            print('Could not find AudioPlayerService in plugin README')
            sys.exit(1)
            
        manifest_path = 'android/app/src/main/AndroidManifest.xml'
        with open(manifest_path, 'r', encoding='utf-8') as f:
            manifest = f.read()
            
        # 3. Verify and inject Foreground Permissions
        for perm in ['android.permission.FOREGROUND_SERVICE', 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK', 'android.permission.WAKE_LOCK']:
            if perm not in manifest:
                manifest = re.sub(r'<application', f'<uses-permission android:name=\"{perm}\" />\n    <application', manifest, count=1)
                
        # 4. Verify and inject AudioPlayerService
        if 'AudioPlayerService' not in manifest:
            manifest = manifest.replace('</application>', '\n        ' + service_match.group(0) + '\n    </application>')
            
        with open(manifest_path, 'w', encoding='utf-8') as f:
            f.write(manifest)
            
        # 5. Verify strings.xml
        strings_match = re.search(r'<string name=\"audio_player_service_description\".*?</string>', readme)
        if strings_match:
            strings_path = 'android/app/src/main/res/values/strings.xml'
            if os.path.exists(strings_path):
                with open(strings_path, 'r', encoding='utf-8') as f:
                    strings = f.read()
                if 'audio_player_service_description' not in strings:
                    strings = strings.replace('</resources>', '    ' + strings_match.group(0) + '\n</resources>')
                with open(strings_path, 'w', encoding='utf-8') as f:
                    f.write(strings)
                    
        # 6. Verify Java Source for Media3 Next/Previous Support
        player_java_path = 'node_modules/@mediagrid/capacitor-native-audio/android/src/main/java/us/mediagrid/capacitorjs/plugins/nativeaudio/AudioPlayerPlugin.java'
        service_java_path = 'node_modules/@mediagrid/capacitor-native-audio/android/src/main/java/us/mediagrid/capacitorjs/plugins/nativeaudio/AudioPlayerService.java'
        
        has_next = False
        has_prev = False
        
        for path in [player_java_path, service_java_path]:
            if os.path.exists(path):
                with open(path, 'r', encoding='utf-8') as f:
                    content = f.read()
                    if 'COMMAND_SEEK_TO_NEXT' in content or 'onSeekToNext' in content or 'onSkipToNext' in content:
                        has_next = True
                    if 'COMMAND_SEEK_TO_PREVIOUS' in content or 'onSeekToPrevious' in content or 'onSkipToPrevious' in content:
                        has_prev = True
                        
        if not has_next or not has_prev:
            print('WARNING: The installed @mediagrid/capacitor-native-audio v3.0.0 is missing full Media3 Next/Previous lock-screen command support.')
        else:
            print('Verified Media3 Next/Previous commands exist in the native plugin source.')
            
        # 7. Verify Manifest Injection Success
        with open(manifest_path, 'r', encoding='utf-8') as f:
            manifest_check = f.read()
            
        manifest_success = True
        if 'AudioPlayerService' not in manifest_check:
            manifest_success = False
        for perm in ['android.permission.FOREGROUND_SERVICE', 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK', 'android.permission.WAKE_LOCK']:
            if perm not in manifest_check:
                manifest_success = False
                
        with open('ci_status.env', 'w') as f:
            f.write(f'NATIVE_AUDIO_VERSION={version}\n')
            f.write(f'HAS_NEXT={"YES" if has_next else "WARNING/NO"}\n')
            f.write(f'HAS_PREV={"YES" if has_prev else "WARNING/NO"}\n')
            f.write(f'MANIFEST_SERVICE={"PASS" if manifest_success else "FAIL"}\n')
            
        if not manifest_success:
            print('ERROR: AndroidManifest.xml injection failed to include required services or permissions.')
            sys.exit(1)
        "
        
    - name: Generate Android Icons
      run: |
        if [ ! -f "assets/icon.png" ]; then
          echo "ERROR: assets/icon.png not found. Cannot generate launcher icons."
          echo 'LAUNCHER_ICONS=FAIL' >> ci_status.env
          exit 1
        fi
        npm install -g @capacitor/assets
        npx @capacitor/assets generate --android
        
        # Verify icon resources exist
        if [ ! -d "android/app/src/main/res/mipmap-mdpi" ]; then
          echo "ERROR: Android launcher icon resources were not generated properly by Capacitor Assets."
          echo 'LAUNCHER_ICONS=FAIL' >> ci_status.env
          exit 1
        fi
        echo 'LAUNCHER_ICONS=PASS' >> ci_status.env
        echo 'LAUNCHER_ICONS=PASS' >> ci_status.env
        echo "Android launcher icon resources verified successfully."
        

    - name: Build APK (Clean & AssembleDebug)
      working-directory: ./android
      run: |
        ./gradlew clean
        ./gradlew assembleDebug --stacktrace
        
    - name: Verify APK Exists
      run: |
        if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "APK build failed, artifact not found!"
          echo 'APK_BUILD=FAIL' >> ci_status.env
          exit 1
        fi
        echo 'APK_BUILD=PASS' >> ci_status.env
        echo "APK successfully built."
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
    - name: CI Summary
      if: always()
      run: |
        source ci_status.env || true
        echo "### Android CI Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **NativeAudio Version:** ${NATIVE_AUDIO_VERSION:-Unknown}" >> $GITHUB_STEP_SUMMARY
        echo "- **Next Support:** ${HAS_NEXT:-Unknown}" >> $GITHUB_STEP_SUMMARY
        echo "- **Previous Support:** ${HAS_PREV:-Unknown}" >> $GITHUB_STEP_SUMMARY
        echo "- **Manifest Service:** ${MANIFEST_SERVICE:-FAIL}" >> $GITHUB_STEP_SUMMARY
        echo "- **Launcher Icons:** ${LAUNCHER_ICONS:-FAIL}" >> $GITHUB_STEP_SUMMARY
        echo "- **APK Build:** ${APK_BUILD:-FAIL}" >> $GITHUB_STEP_SUMMARY
